<header class="navbar">
  <div class="nav-left">
    <a [routerLink]="isLoggedIn() ? '/dashboard' : '/login'" class="logo" (click)="closeMenu()">
      RapL
    </a>

    <nav class="nav-links desktop-nav" *ngIf="isLoggedIn()">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">
        Dashboard
      </a>

      <a routerLink="/courses" routerLinkActive="active" (click)="closeMenu()">
        Courses
      </a>

      <a *ngIf="isAdmin()" routerLink="/add-course" routerLinkActive="active" (click)="closeMenu()">
        Add Course
      </a>

      <a routerLink="/rapl-genie" routerLinkActive="active" (click)="closeMenu()">
        RapL Genie
      </a>
    </nav>
  </div>

  <div class="nav-right desktop-nav" *ngIf="isLoggedIn(); else guestNav">
    <div class="user-profile">
      <div class="user-details">
        <span class="user-name">{{ currentUser()?.name }}</span>
        <span class="user-role" [class.admin-role]="isAdmin()">{{ currentUser()?.role }}</span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()">
        Logout
      </button>
    </div>
  </div>

  <ng-template #guestNav>
    <div class="nav-right desktop-nav">
      <a routerLink="/rapl-genie" routerLinkActive="active" class="guest-link">RapL Genie</a>
      <a routerLink="/login" routerLinkActive="active" class="login-nav-link">Sign In</a>
    </div>
  </ng-template>

  <!-- Mobile Toggle Button -->
  <button
    type="button"
    class="mobile-toggle"
    (click)="toggleMenu()"
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="mobileMenuOpen"
  >
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
  </button>
</header>

<!-- Mobile Navigation Drawer -->
<div class="mobile-nav-drawer" *ngIf="mobileMenuOpen">
  <div class="mobile-nav-content">
    <nav class="mobile-nav-links" *ngIf="isLoggedIn()">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
      <a routerLink="/courses" routerLinkActive="active" (click)="closeMenu()">Courses</a>
      <a *ngIf="isAdmin()" routerLink="/add-course" routerLinkActive="active" (click)="closeMenu()">Add Course</a>
      <a routerLink="/rapl-genie" routerLinkActive="active" (click)="closeMenu()">RapL Genie</a>
    </nav>

    <div class="mobile-user-section" *ngIf="isLoggedIn(); else mobileGuest">
      <div class="mobile-user-info">
        <div class="user-name">{{ currentUser()?.name }}</div>
        <div class="user-role" [class.admin-role]="isAdmin()">{{ currentUser()?.role }}</div>
      </div>
      <button type="button" class="mobile-logout-btn" (click)="logout()">
        Logout
      </button>
    </div>

    <ng-template #mobileGuest>
      <div class="mobile-guest-links">
        <a routerLink="/rapl-genie" (click)="closeMenu()">RapL Genie</a>
        <a routerLink="/login" class="mobile-login-btn" (click)="closeMenu()">Sign In</a>
      </div>
    </ng-template>
  </div>
</div>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
