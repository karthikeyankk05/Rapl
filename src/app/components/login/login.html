<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="logo">RapL</div>
      <h1>Sign in to RapL</h1>
      <p>Enter your credentials to access the learning portal</p>
    </div>

    <div *ngIf="errorMessage" class="alert-error" role="alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="name@rapl.demo"
          autocomplete="email"
        />
        <small class="error" *ngIf="email.invalid && (email.touched || submitted)">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Please enter a valid email address.</span>
        </small>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="current-password"
        />
        <small class="error" *ngIf="password.invalid && (password.touched || submitted)">
          Password is required.
        </small>
      </div>

      <button type="submit" class="submit-button">
        Sign In
      </button>

    </form>

    <div class="demo-box">
      <div class="demo-title">Demo Credentials</div>
      <p class="demo-sub">Click a role below to quickly populate the form for testing:</p>

      <div class="demo-roles">
        <button
          type="button"
          class="demo-role-btn"
          (click)="fillDemo('student')"
        >
          <span class="role-badge student">Student</span>
          <span class="demo-user">student&#64;rapl.demo</span>
          <span class="demo-pwd">student123</span>
        </button>

        <button
          type="button"
          class="demo-role-btn"
          (click)="fillDemo('admin')"
        >
          <span class="role-badge admin">Admin</span>
          <span class="demo-user">admin&#64;rapl.demo</span>
          <span class="demo-pwd">admin123</span>
        </button>
      </div>
    </div>

  </div>
</div>
